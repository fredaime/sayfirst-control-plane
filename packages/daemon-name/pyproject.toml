# SPDX-License-Identifier: Apache-2.0
[project]
name = "sayfirst-daemon"
version = "0.3.3"
description = "Installs the open control plane's daemon; the name of its command, held by the project"
readme = "README.md"
requires-python = ">=3.12,<3.15"
# One dependency and nothing else: this distribution is the name of the
# daemon's command, held on the index so that handing the name to an installer
# installs the daemon. It declares no command — the command belongs to
# `sayfirst-control-plane`, and `tests/test_client_distribution_names.py`
# forbids two distributions of this repository to install one — and it ships no
# module. `tests/test_the_daemon_name_holds_a_name_and_nothing_else.py` holds
# all of that.
dependencies = ["sayfirst-control-plane==0.3.3"]
license = "Apache-2.0"

authors = [{ name = "fredaime", email = "frederic.aime@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/fredaime/sayfirst-control-plane"
Documentation = "https://github.com/fredaime/sayfirst-control-plane/blob/main/packages/daemon-name/README.md"
Changelog = "https://github.com/fredaime/sayfirst-control-plane/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
sayfirst-control-plane = { workspace = true }

# No module is selected, on purpose: the wheel is its metadata and the two
# notices.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
