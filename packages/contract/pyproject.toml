# SPDX-License-Identifier: Apache-2.0
[project]
name = "sayfirst-contract"
version = "0.2.0"
description = "The public domain contract and its generated binding"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []
license = "Apache-2.0"

authors = [{ name = "fredaime", email = "frederic.aime@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

# The public repository this distribution sends a reader to. It does not exist
# yet: article 0 creates it fresh in the act that publishes, and these are the
# names the operator chose for that act. `tests/test_pointers_survive_publication.py`
# holds them, so a rename lands in every project file and in the guard together
# or not at all. No licence classifier: the licence is declared as an expression
# above, and an index refuses a distribution that carries both.
[project.urls]
Repository = "https://github.com/fredaime/sayfirst-control-plane"
Documentation = "https://github.com/fredaime/sayfirst-control-plane/blob/main/packages/contract/README.md"
Changelog = "https://github.com/fredaime/sayfirst-control-plane/blob/main/CHANGELOG.md"

[project.optional-dependencies]
stub = ["sayfirst-contract-stub==0.2.0"]

[tool.uv.sources]
sayfirst-contract-stub = { workspace = true }

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sayfirst_contract"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
