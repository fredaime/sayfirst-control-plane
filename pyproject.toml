# SPDX-License-Identifier: Apache-2.0
[project]
name = "sayfirst-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pytest==8.4.1",
  "referencing==0.36.2",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
# A package joins the test run by existing, never by being added to a list here:
# pytest expands a glob in `testpaths`, and `conftest.py` at the repository root
# derives the import roots the same way. `tests/test_package_discovery.py` holds
# both, and fails naming any package the configuration would miss.
testpaths = ["tests", "packages/*/tests"]
addopts = ["-rxX"]
markers = [
  "identity: guards of article 6 that read the operating system's own record",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
